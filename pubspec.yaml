name: top_trading
description: Marketplace geolocalizado "Top Trading"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Login nativo con Google (selector de cuentas del sistema)
  google_sign_in: ^6.2.1

  # Geolocalización
  geolocator: ^12.0.0

  # Deep linking a WhatsApp
  url_launcher: ^6.3.2

  # Estado (elige el que prefieras; Provider es el más simple para empezar)
  provider: ^6.1.2

  # Carga de imágenes remotas con cache
  cached_network_image: ^3.3.1

  # Tipografía del diseño
  google_fonts: ^6.2.1

  # Selección de fotos (cámara / galería)
  image_picker: ^1.1.2

  # Formularios / validaciones opcionales
  intl: ^0.19.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true