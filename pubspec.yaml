name: top_trading
description: Marketplace geolocalizado "Al Lado"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # Navegación avanzada
  go_router: ^14.2.0

  # Compartir contenido
  share_plus: ^10.1.0

  # Login nativo con Google
  google_sign_in: ^6.2.1

  # Geolocalización
  geolocator: ^12.0.0

  # Deep linking a WhatsApp
  url_launcher: ^6.3.2

  # Estado
  provider: ^6.1.2

  # Carga de imágenes remotas con cache
  cached_network_image: ^3.3.1

  # Tipografía del diseño
  google_fonts: ^6.2.1

  # Selección de fotos (cámara / galería)
  image_picker: ^1.1.2

  # Formularios / validaciones opcionales
  intl: ^0.19.0
  
  # QR Code
  qr_flutter: ^4.1.0

  # Mapa interactivo (OpenStreetMap, sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Genera el ícono de la app (launcher icon) para Android e iOS
  # a partir de assets/icon/icon.png
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Carpeta de recursos gráficos (logo del AppBar, ícono fuente, etc.)
  assets:
    - assets/logo.png
    - assets/icon/icon.png

    

# Configuración de flutter_launcher_icons.
# Después de guardar tu imagen en assets/icon/icon.png, corre:
#   flutter pub get
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"